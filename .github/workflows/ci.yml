name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Satisfies the required env vars (JWT_SECRET, CLIENT_ORIGIN, etc.) the
      # same way a developer would locally — no CI-specific config needed.
      # The Mongo URI in here is unused by the test suite (it runs against
      # mongodb-memory-server) but must still be present.
      - name: Set up environment
        working-directory: server
        run: cp .env.example .env

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Run tests
        working-directory: server
        run: npm test

  client-tests:
    name: Client (lint + typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Typecheck
        working-directory: client
        run: npx tsc -b

      - name: Run tests
        working-directory: client
        run: npm test

  e2e-tests:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # Same reasoning as the server-tests job: this is exactly what a
      # developer runs locally, not a CI-specific substitute. Playwright's
      # webServer config overrides MONGODB_URI to point at the service
      # container's provisio_e2e database; everything else (JWT_SECRET,
      # CLIENT_ORIGIN) comes from here.
      - name: Set up server environment
        working-directory: server
        run: cp .env.example .env

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Even on a cache hit, Chromium's OS-level dependencies (fonts, libs)
      # still need to be present on this fresh runner.
      - name: Install Playwright OS dependencies
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
